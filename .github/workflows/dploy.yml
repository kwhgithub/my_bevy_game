name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # 当 main 分支有推送时触发
  workflow_dispatch:  # 允许你手动在 GitHub 网站上触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked
      - name: Build
        run: |
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --out-dir ./out/ --target web ./target/wasm32-unknown-unknown/release/my_bevy_game.wasm
      - name: Create index.html
        run: |
          echo '<!doctype html><html lang="en"><body style="margin: 0px;"><script type="module">import init from "./my_bevy_game.js"; init().catch((error) => { if (!error.message.startsWith("Using exceptions for control flow, don\'t mind me. This isn\'t actually an error!")) { throw error; } });</script></body></html>' > ./out/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4