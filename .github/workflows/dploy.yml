name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]          # 当 main 分支有推送时触发
  workflow_dispatch:            # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ⭐ 唯一新增：缓存 Rust 所有依赖（包括编译好的二进制）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true       # 同时缓存 ~/.cargo/bin 下的工具（如 wasm-bindgen）

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version $(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')


      - name: Build
        run: |
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --out-dir ./out/ --target web ./target/wasm32-unknown-unknown/release/my_bevy_game.wasm

      # 用 wasm-opt 压缩 wasm 体积（91MB -> ~25MB）
      # 注意：不要用 apt 的 binaryen（版本过旧，-Oz 会损坏 table 声明，
      # 导致线上 "WebAssembly.Table.grow(): failed to grow table" 白屏），
      # 改用官方 Releases 的固定新版
      - name: Optimize wasm with wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          ./binaryen-version_123-x86_64-linux/bin/wasm-opt --version
          ls -lh ./out/my_bevy_game_bg.wasm
          ./binaryen-version_123-x86_64-linux/bin/wasm-opt -Oz --enable-bulk-memory ./out/my_bevy_game_bg.wasm -o ./out/my_bevy_game_bg.wasm
          ls -lh ./out/my_bevy_game_bg.wasm

      - name: Create index.html and .nojekyll
        run: |
          cp ./index.html ./out/index.html
          touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4